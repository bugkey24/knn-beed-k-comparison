# Centralized Project Configuration for KNN BEED Classification

dataset:
  path: "beed-bangalore-eeg-epilepsy-dataset/BEED_Data.csv"
  target_column: "y"
  feature_prefix: "X"
  num_features: 16
  num_classes: 4
  expected_rows: 8000

split:
  test_size: 0.20
  random_state: 42
  stratify: true

preprocessing:
  scaler: "standard"  # Z-score standardization (zero-mean, unit-variance)

model:
  algorithm: "knn"
  k_values: [1, 3, 5, 7, 9, 11, 15, 21, 25, 31]
  metric: "euclidean"
  weights: "uniform"

evaluation:
  average: "macro"
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"

output:
  dir: "outputs"
  figures_dir: "outputs/figures"
  results_dir: "outputs/results"
  models_dir: "outputs/models"
  logs_dir: "outputs/logs"
